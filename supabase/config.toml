project_id = "jarvis-foundation"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

# M1 uses Next.js Route Handlers, not Supabase Edge Functions.
[edge_runtime]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/verify"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Necessary for approved-email registration. Database trigger rejects all other users.
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 30
token_verifications = 30
token_refresh = 150

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 600

[auth.email.template.confirmation]
subject = "Confirm your local account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your local password"
content_path = "./supabase/templates/recovery.html"

[analytics]
enabled = false
